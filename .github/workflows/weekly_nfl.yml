name: Tuesday NFL Power Rankings Draft

on:
  schedule:
    - cron: '0 15 * * 2'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if week was already processed'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  issues: write

jobs:
  draft-tuesday-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Tuesday Power Rankings Draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: python weekly_nfl_post.py --mode rankings

      - name: Commit generated chart and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/ last_posted_week.json
          git diff --staged --quiet || git commit -m "Add Tuesday NFL power rankings chart"
          git push
